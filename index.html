<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Keyify - Car Key Compatibility Check</title>
  <link rel="stylesheet" href="style.css?v=35">
</head>
<body>
  <header>
    <h1>Keyify</h1>
    <p>Find out what key your car uses and how it gets programmed.</p>
  </header>

  <main>
    <section class="search">
      <label>Make
        <select id="make"><option value="">Select make</option></select>
      </label>
      <label>Model
        <select id="model" disabled><option value="">Select model</option></select>
      </label>
      <label>Year
        <select id="year" disabled><option value="">Select year</option></select>
      </label>
    </section>

    <section class="search partsearch">
      <label for="partq">Or search by part number, FCC ID or board code
        <input id="partq" type="search" placeholder="e.g. 8990H-AQ010 or 2110" autocomplete="off">
      </label>
    </section>

    <div class="resetrow">
      <button type="button" id="reset" class="reset" hidden>Start over</button>
    </div>

    <section id="results" aria-live="polite"></section>

    <p class="disclaimer">
      Fitment comes from supplier listings and has not been independently
      verified. Confirm with your VIN before buying.
    </p>
  </main>

  <!-- The ?v=11 stops GitHub Pages serving an old cached copy.
       Add 1 to the number each time you change that file. -->
  <script src="keys.js?v=35"></script>
  <script src="keys-toyota.js?v=35"></script>
  <script src="keys-honda.js?v=35"></script>
  <script src="keys-lexus.js?v=35"></script>
  <script src="keys-ford.js?v=35"></script>
  <script src="keys-subaru.js?v=35"></script>
  <script src="keys-hyundai.js?v=35"></script>
  <script src="keys-chevrolet.js?v=35"></script>
  <script src="keys-ram.js?v=35"></script>
  <script src="keys-kia.js?v=35"></script>
  <script src="keys-nissan.js?v=35"></script>
  <script src="keys-stellantis.js?v=35"></script>
  <script src="keys-gm.js?v=35"></script>
  <script src="keys-mazda.js?v=35"></script>
  <script src="keys-mitsubishi.js?v=35"></script>
  <script src="keys-european.js?v=35"></script>
  <script src="group.js?v=35"></script>
  <script src="script.js?v=35"></script>
</body>
</html>
